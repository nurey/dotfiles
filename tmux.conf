set-option -g default-command "reattach-to-user-namespace -l zsh"
set-option -g history-limit 16000
setw -g mode-keys vi
set -g mouse on
# Pass the wheel through to fullscreen/alt-screen apps (e.g. Claude Code);
# only enter copy-mode for plain shells.
bind -n WheelUpPane if-shell -Ft= '#{?pane_in_mode,1,#{mouse_any_flag}}' 'send-keys -M' 'copy-mode -e'
bind -n WheelDownPane select-pane -t= \; send-keys -M
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind-key -r C-h select-window -t :-
bind-key -r C-l select-window -t :+
unbind [
bind ` copy-mode
unbind p
bind p paste-buffer
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel
bind y run "tmux save-buffer - | reattach-to-user-namespace pbcopy"
bind R source-file ~/.tmux.conf \; display-message "  Config reloaded.."
bind -n C-k send-keys -R \; clear-history

# set pane title to pane number 
set -g pane-border-status top
set -g pane-border-format "#{pane_index}"

# open new panes/windows in the current pane's working directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'

#set -g @resurrect-processes '"~puma->bin/rails server" "ngrok->ngrok start web --config ~/.ngrok2/shopify-zero.yml" "~webpack->bin/webpack-dev-server" "~gcloud.py->gcloud beta emulators bigtable start"'

# Truecolor under Ghostty (tmux-sensible otherwise caps at screen-256color)
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"

# Claude Code specific
# https://code.claude.com/docs/en/terminal-config#configure-tmux
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Smart layout
run-shell /Volumes/Development/tmux-smart-layout/smart-layout.tmux

# Initializes TMUX plugin manager.
# Keep this line at the very bottom of tmux.conf.
run '~/.tmux/plugins/tpm/tpm'
